<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OddCode — Convertisseur MAJ ⇆ min</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="./images/logo.png">
    <script src="./js/minMaj.js" defer></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-light-subtle py-5">

    <div class="container">
        <header class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <h1 class="h3 fw-bold text-body mb-1">
                    <i class="bi bi-flask text-success me-2"></i>OddCode #1 — Convertisseur de MAJ
                    <i class="bi bi-arrow-left-right mx-1 fs-5 text-danger"></i> min
                </h1>
                <p class="text-body-secondary small mb-0">
                    Tapez ou collez votre texte ci-dessous pour le convertir instantanément.
                </p>
            </div>
            <img src="./images/logo.png" alt="Logo OddCode" class="img-fluid flex-shrink-0 ms-3"
                style="max-height: 60px; width: auto;" />
        </header>

        <main class="row g-3 align-items-center">

            <div class="col-12 col-md">
                <div class="card shadow-sm border-1">
                    <div class="card-header bg-body d-flex justify-content-between align-items-center py-2">
                        <span id="iInput" class="fw-semibold text-body"><i class="bi bi-type me-1 text-success"></i>
                            Texte
                            minuscule</span>
                        <span id="count-input" class="badge text-bg-light border font-monospace fw-normal">0
                            caract.</span>
                    </div>
                    <div class="card-body p-0">
                        <span class="position-absolute end-0 fs-2 text-body-tertiary d-none" id="clear">
                            <i class="bi bi-x"></i>
                        </span>
                        <textarea id="text-input" class="form-control border-0 font-monospace p-3"
                            style="min-height: 180px; max-height: 450px; resize: none; overflow-y: hidden;"
                            placeholder="Placer votre texte ici..."></textarea>

                    </div>
                </div>
            </div>

            <div class="col-12 col-md-auto d-flex justify-content-center py-2 py-md-0">
                <button id="btn-swap"
                    class="btn btn-outline-primary rounded-circle p-3 shadow-sm d-flex align-items-center justify-content-center"
                    style="width: 50px; height: 50px;" title="Inverser les majuscules et minuscules">
                    <i class="bi bi-arrow-left-right fs-4 d-none d-md-block rotate-icon"></i>
                    <i class="bi bi-arrow-down-up fs-4 d-block d-md-none rotate-icon"></i>
                </button>
            </div>

            <div class="col-12 col-md">
                <div class="card shadow-sm border-1">
                    <div class="card-header bg-body d-flex justify-content-between align-items-center py-2">
                        <span id="iOutput" class="fw-semibold text-body"><i class="bi bi-type-h1 me-1 text-primary"></i>
                            Texte en
                            MAJUSCULE</span>
                        <button id="btn-copy" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-clipboard me-1"></i> Copier
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <textarea id="text-output" class="form-control-plaintext bg-body-tertiary font-monospace p-3"
                            style="min-height: 180px; max-height: 450px; resize: none; overflow-y: hidden;"
                            placeholder="Le texte converti apparaîtra ici..." readonly></textarea>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
